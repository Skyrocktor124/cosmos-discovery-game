<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提示词手册 · Prompt Booklet</title>
<meta name="description" content="10 条精选高质量 AI 提示词,分 5 大类,支持搜索、分类浏览、一键复制与离线导出。">
<meta name="theme-color" content="#0B0B0C">
</head>
<body>
<style id="app-style">
/* ============================================================
   提示词手册 — 单文件交互电子册
   零依赖:无 CDN、无框架、无网络请求。双击即可打开,离线可用。
   ============================================================ */

:root{
  color-scheme: dark;
  --bg:#0B0B0C;
  --bg-soft:#121214;
  --surface:#141417;
  --surface-hi:#1A1A1E;
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(255,255,255,.18);
  --text:#EDEDEF;
  --text-dim:#A1A1AA;
  --muted:#71717A;
  --accent-a:#8B5CF6;
  --accent-b:#3B82F6;
  --accent-soft:rgba(139,92,246,.14);
  --code-bg:#0E0E10;
  --shadow:0 24px 60px -20px rgba(0,0,0,.8);
  --radius:16px;
}

:root[data-theme="light"]{
  color-scheme: light;
  --bg:#FBFBFC;
  --bg-soft:#F4F4F6;
  --surface:#FFFFFF;
  --surface-hi:#FFFFFF;
  --line:rgba(9,9,11,.09);
  --line-hi:rgba(9,9,11,.18);
  --text:#18181B;
  --text-dim:#52525B;
  --muted:#8A8A93;
  --accent-soft:rgba(139,92,246,.10);
  --code-bg:#F7F7F9;
  --shadow:0 24px 60px -28px rgba(9,9,11,.28);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
    "PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",
    "Noto Sans SC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* 背景的两团极淡辉光 —— 唯一的"颜色",其余全部靠留白 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 420px at 12% -6%, rgba(139,92,246,.13), transparent 62%),
    radial-gradient(620px 420px at 92% 4%, rgba(59,130,246,.10), transparent 60%);
}
:root[data-theme="light"] body::before{
  background:
    radial-gradient(720px 420px at 12% -6%, rgba(139,92,246,.10), transparent 62%),
    radial-gradient(620px 420px at 92% 4%, rgba(59,130,246,.08), transparent 60%);
}

.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0 20px 140px}

/* ---------- 顶部 ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 0}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}
.brand .dot{width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
  box-shadow:0 0 12px rgba(139,92,246,.9)}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:11px;
  background:transparent;border:1px solid var(--line);
  color:var(--text-dim);cursor:pointer;
  transition:border-color .18s ease,color .18s ease,background .18s ease;
}
.icon-btn:hover{color:var(--text);border-color:var(--line-hi);background:var(--surface)}
.icon-btn:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px}

/* ---------- 大标题 ---------- */
header.hero{padding:44px 0 32px}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:999px;
  border:1px solid var(--line-hi);background:var(--accent-soft);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);
}
h1{
  margin:20px 0 0;font-size:clamp(34px,8.4vw,60px);line-height:1.06;
  font-weight:600;letter-spacing:-.035em;
  background:linear-gradient(120deg,var(--text) 30%,var(--accent-a) 78%,var(--accent-b));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin:16px 0 0;max-width:52ch;color:var(--text-dim);font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:26px;
  font-size:13px;color:var(--muted)}
.stats b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 工具栏(吸顶) ---------- */
.toolbar{
  position:sticky;top:0;z-index:20;margin:0 -20px;padding:12px 20px 10px;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;transition:border-color .2s ease;
}
.toolbar.stuck{border-bottom-color:var(--line)}

.search{position:relative;display:flex;align-items:center}
.search .lead{position:absolute;left:15px;color:var(--muted);display:flex;pointer-events:none}
#q{
  width:100%;padding:13px 44px 13px 44px;
  background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:13px;
  font:inherit;font-size:15px;outline:none;
  transition:border-color .18s ease,box-shadow .18s ease;
}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-decoration,#q::-webkit-search-cancel-button,
#q::-webkit-search-results-button{-webkit-appearance:none;appearance:none;display:none}
#q:focus{border-color:var(--accent-a);box-shadow:0 0 0 4px var(--accent-soft)}
#clear{position:absolute;right:8px;width:30px;height:30px;border-radius:8px;
  display:none;border:0;background:transparent;color:var(--muted);cursor:pointer}
#clear:hover{color:var(--text);background:var(--surface-hi)}
#clear.on{display:inline-flex;align-items:center;justify-content:center}
.kbd{position:absolute;right:14px;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;pointer-events:none}
@media (max-width:700px){.kbd{display:none}}

/* ---------- 分类标签 ---------- */
.tabs{
  display:flex;gap:8px;margin-top:12px;padding-bottom:2px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:transparent;
  color:var(--text-dim);font:inherit;font-size:13.5px;cursor:pointer;
  transition:color .18s ease,border-color .18s ease,background .18s ease;
}
.tab:hover{color:var(--text);border-color:var(--line-hi)}
.tab:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px}
.tab[aria-selected="true"]{
  color:#fff;border-color:transparent;
  background:linear-gradient(120deg,var(--accent-a),var(--accent-b));
  box-shadow:0 6px 20px -8px rgba(99,102,241,.9);
}
.tab .n{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}

/* ---------- 卡片 ---------- */
.count{margin:24px 0 12px;font-size:12.5px;color:var(--muted);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:12px}

.card{
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);overflow:hidden;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.card:hover{border-color:var(--line-hi)}
.card.open{border-color:var(--line-hi);box-shadow:var(--shadow)}

.card-head{
  width:100%;display:flex;gap:14px;align-items:flex-start;
  padding:18px 18px;background:transparent;border:0;
  color:inherit;font:inherit;text-align:left;cursor:pointer;
}
.card-head:focus-visible{outline:2px solid var(--accent-a);outline-offset:-2px;border-radius:var(--radius)}
.num{
  flex:0 0 auto;width:30px;height:30px;margin-top:1px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--bg-soft);
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.card.open .num{
  border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
}
.head-main{flex:1 1 auto;min-width:0}
.card h2{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.012em;line-height:1.4}
.card .en{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.card p.desc{margin:8px 0 0;color:var(--text-dim);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tag{
  font-size:11.5px;color:var(--muted);padding:2.5px 8px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg-soft);
}
.chev{flex:0 0 auto;margin-top:4px;color:var(--muted);display:flex;
  transition:transform .24s cubic-bezier(.4,0,.2,1)}
.card.open .chev{transform:rotate(180deg);color:var(--text)}

.panel{display:none;padding:0 18px 18px}
.card.open .panel{display:block;animation:reveal .26s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.code-wrap{border:1px solid var(--line);border-radius:12px;background:var(--code-bg);overflow:hidden}
.code-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 10px 9px 14px;border-bottom:1px solid var(--line);
}
.code-bar .lbl{flex:0 1 auto;min-width:0;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-bar .lbl-short{display:none}
@media (max-width:560px){
  .code-bar .lbl-full{display:none}
  .code-bar .lbl-short{display:inline}
}
.copy{
  flex:0 0 auto;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line-hi);background:transparent;
  color:var(--text-dim);font:inherit;font-size:12.5px;
  transition:all .18s ease;
}
.copy:hover{color:var(--text);background:var(--surface-hi);border-color:var(--text-dim)}
.copy:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px}
.copy.done{
  color:#fff;border-color:transparent;
  background:linear-gradient(120deg,var(--accent-a),var(--accent-b));
}
pre{
  margin:0;padding:16px 16px 18px;max-height:min(56vh,520px);overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:13px;line-height:1.72;color:var(--text-dim);
  white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch;
}
pre::-webkit-scrollbar{width:10px}
pre::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:99px;
  border:3px solid var(--code-bg)}
.hint{display:flex;gap:9px;margin:12px 0 0;padding:11px 13px;
  border-left:2px solid var(--accent-a);background:var(--bg-soft);
  border-radius:0 9px 9px 0;font-size:13px;color:var(--text-dim)}
.hint b{color:var(--text);font-weight:600}

.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:14px}
.empty p{margin:0;font-size:14px}

/* ---------- 悬浮导出 ---------- */
.fab{
  position:fixed;right:max(20px,env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 18px;border-radius:999px;border:1px solid var(--line-hi);
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);font:inherit;font-size:13.5px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease;
}
.fab:hover{transform:translateY(-2px);border-color:var(--accent-a)}
.fab:focus-visible{outline:2px solid var(--accent-a);outline-offset:3px}
@media (max-width:520px){.fab span{display:none}.fab{padding:14px;border-radius:50%}}

/* ---------- 吐司 ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:9px;
  padding:11px 18px;border-radius:999px;
  border:1px solid var(--line-hi);background:var(--surface-hi);
  color:var(--text);font-size:13.5px;box-shadow:var(--shadow);
  transition:opacity .22s ease,transform .22s cubic-bezier(.4,0,.2,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .ok{color:#4ADE80;display:flex}

footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12.5px}
footer p{margin:0 0 6px}
footer b{color:var(--text-dim);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><i class="dot"></i>Prompt Booklet</div>
    <button class="icon-btn" id="theme" type="button" aria-label="切换浅色 / 深色主题"></button>
  </div>

  <header class="hero">
    <div class="badge" id="badge">Booklet Version 1.0</div>
    <h1>提示词手册</h1>
    <p class="sub">10 条经过打磨的高质量提示词,覆盖内容、增长、效率、思考与开发。
      每一条都可以整段复制,直接粘进任意 AI 对话框使用。</p>
    <div class="stats">
      <div><b id="s-count">10</b> 条提示词</div>
      <div><b id="s-cat">5</b> 个分类</div>
      <div><b>1</b> 个文件 · 离线可用</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="search">
      <i class="lead" id="ico-search"></i>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="搜索标题、场景、标签或提示词正文…" aria-label="搜索提示词">
      <kbd class="kbd">/</kbd>
      <button id="clear" type="button" aria-label="清空搜索"></button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="提示词分类"></div>
  </div>

  <p class="count" id="count"></p>
  <main class="list" id="list"></main>

  <footer>
    <p><b>怎么用:</b>点开任意卡片 → 点「复制提示词」→ 粘进 Claude / ChatGPT / 豆包 的对话框 → 再补一句你的具体需求。</p>
    <p><b>离线保存:</b>点右下角按钮,把整本手册存成一个 HTML 文件,断网也能打开。</p>
    <p style="margin-top:14px">© <span id="year"></span> Prompt Booklet · 单文件构建,无追踪、无网络请求。</p>
  </footer>
</div>

<button class="fab" id="export" type="button" aria-label="导出离线 HTML 文件">
  <i id="ico-dl"></i><span>导出离线版</span>
</button>

<div id="toast" role="status" aria-live="polite"></div>

<script id="app-script">
(function () {
  'use strict';

  /* ==========================================================
     1) 内容区 —— 要换成你自己的提示词,只改下面这两个数组即可。
        CATEGORIES: 分类(id / 中文名 / 图标名)
        PROMPTS:    每条提示词(cat 必须对应上面的分类 id)
     ========================================================== */

  var CATEGORIES = [
    { id: 'content', name: '内容创作', icon: 'pen' },
    { id: 'growth',  name: '增长变现', icon: 'trend' },
    { id: 'work',    name: '效率提速', icon: 'zap' },
    { id: 'think',   name: '思维成长', icon: 'bulb' },
    { id: 'build',   name: '设计开发', icon: 'code' }
  ];

  var PROMPTS = [
    {
      cat: 'content',
      title: '爆款短视频脚本官',
      en: 'Viral Short-Form Video Scriptwriter',
      desc: '45–60 秒的黄金结构脚本:3 秒钩子、每 7 秒一个节奏点、结尾只留一个能骗到评论的动作。给三版钩子并标出最强的一版。',
      tags: ['短视频', '抖音', '脚本', '选题'],
      tip: '把「话题 + 人群」一起给它,例如:话题=副业做小游戏,人群=想赚第一笔钱的上班族。',
      prompt: `You are a top-tier short-form video scriptwriter whose scripts have accumulated over 100 million views on TikTok, Reels, and Douyin.

I will give you a TOPIC and an AUDIENCE. Produce a 45-60 second script.

Rules:
1. Open with a hook in the first 3 seconds. Write 3 alternative hooks and mark the strongest one. Never open with a greeting or a self-introduction.
2. Structure the body as: Hook -> Tension (why the viewer is stuck or wrong) -> Turn (the insight) -> Proof (a concrete number, story, or demo) -> Payoff (what they can do today).
3. Write in spoken language: short sentences, second person, no jargon, no filler adjectives. Apply the read-aloud test - if a sentence takes more than one breath, cut it.
4. Insert a pattern interrupt every 7-10 seconds (a question, a cut, a prop, a number on screen).
5. End with a single call to action that earns a comment, not a plea for likes.

Output format:
- SCRIPT: timestamped lines, with [visual direction] in brackets
- CAPTION: under 100 characters, plus 5 hashtags
- TITLE OPTIONS: 3 variations
- WHY IT WORKS: 2 sentences on the psychological trigger you used

If I have not given you both the topic and the audience, ask for them before writing anything.`
    },
    {
      cat: 'content',
      title: '高转化文案炼金师',
      en: 'Direct-Response Copy Alchemist',
      desc: '直复式营销文案。它会先逼你说清人群、价格和承诺,再产出标题、正文、卖点和抗拒处理——并且拒绝写任何形容词式空话。',
      tags: ['销售文案', '落地页', '转化', '带货'],
      tip: '它会先反问你四个问题,老老实实回答,产出质量差别极大。',
      prompt: `You are a direct-response copywriter trained in the school of Ogilvy, Halbert, and Sugarman. You sell with clarity and specificity, never with hype.

Before writing a single word of copy, ask me for: the product, the exact customer, the price, and the one transformation the product delivers. Do not proceed until you have all four.

Then produce:
1. A one-sentence value proposition in this format: [Product] helps [specific customer] achieve [specific outcome] without [main objection].
2. Three headline angles: pain-led, desire-led, and curiosity-led.
3. A 150-word body block using PAS (Problem - Agitate - Solve).
4. Five bullet points, each written as benefit + proof + intrigue.
5. A close that handles the single biggest objection, followed by a risk reversal.

Constraints:
- Replace every adjective with a number, a comparison, or a demonstration.
- Never write "revolutionary", "game-changing", "cutting-edge", "seamless", or "unlock".
- Keep the final copy at a 7th-grade reading level and tell me the grade you actually hit.
- Finish with the one line you would delete first if forced to cut, and why.`
    },
    {
      cat: 'growth',
      title: '冷启动增长参谋',
      en: 'Zero-to-One Growth Strategist',
      desc: '零预算、单人、每周 10 小时约束下的 30 天冷启动方案。会先反问你三个问题,并明确给出「什么情况下应该放弃这个渠道」。',
      tags: ['增长', '冷启动', '获客', '副业'],
      tip: '越具体越好:说清产品、现在有多少用户、你每周真能投入几小时。',
      prompt: `You are a growth strategist who has taken products from 0 to their first 1,000 paying users with no paid advertising budget.

I will describe my product and my current traction. Your job is to design a 30-day cold-start plan.

Process:
1. First, interrogate my assumptions. Ask me the three questions whose answers would most change the plan, then wait for my answers.
2. Identify the single highest-leverage channel for my specific product. Reject the channels that only work at scale or with a budget, and explain in one line why each rejected channel is wrong for me right now.
3. Design one repeatable weekly loop: what I do, how long it takes, what it produces, and how it compounds.
4. Give me a 30-day calendar with a concrete daily action of 60 minutes or less.
5. Define the kill criteria: the exact metric and threshold at which I should abandon this channel.

Rules:
- Assume zero budget, one person, and 10 hours per week. If your plan needs more than that, it is the wrong plan.
- Prefer actions that produce a durable asset (a page, a list, a relationship) over actions that produce a one-time spike.
- Every recommendation must include the first concrete step I can take in the next hour.`
    },
    {
      cat: 'growth',
      title: '定价与变现设计师',
      en: 'Offer & Pricing Architect',
      desc: '三档产品结构 + 价值堆叠 + 敢承诺的保证条款。它会算给你看每一项凭什么值这个价,并指出哪一档可能是亏本的。',
      tags: ['定价', '商业模式', '变现', '产品包装'],
      tip: '结尾会给出「最该先验证的两个假设」和最便宜的验证方法,那才是重点。',

  function icon(name, size) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + (size || 18) + '" height="' +

      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +

  /* ==========================================================

  var SHELL = (function () {

  /* ==========================================================

  var $ = function (s) { return document.querySelector(s); };
  var listEl = $('#list'), tabsEl = $('#tabs'), qEl = $('#q'),
      clearEl = $('#clear'), countEl = $('#count'), toastEl = $('#toast');

  var state = { cat: 'all', q: '', open: {} };

  function catName(id) {
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i].name;
    return id;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function matches(p, q) {
    if (!q) return true;
    var hay = (p.title + ' ' + p.en + ' ' + p.desc + ' ' + p.tags.join(' ') + ' ' +
               catName(p.cat) + ' ' + p.prompt).toLowerCase();
    // 多关键词:空格分隔,全部命中才算
    var words = q.toLowerCase().split(/\s+/).filter(Boolean);
    for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) === -1) return false;
    return true;
  }

  function visible() {
    return PROMPTS.filter(function (p) {
      return (state.cat === 'all' || p.cat === state.cat) && matches(p, state.q);
    });
  }

  function buildTabs() {
    var html = '<button class="tab" role="tab" data-cat="all" aria-selected="false">' +
      icon('layers', 15) + '全部<span class="n">' + PROMPTS.length + '</span></button>';
    CATEGORIES.forEach(function (c) {
      var n = PROMPTS.filter(function (p) { return p.cat === c.id; }).length;
      html += '<button class="tab" role="tab" data-cat="' + c.id + '" aria-selected="false">' +
        icon(c.icon, 15) + esc(c.name) + '<span class="n">' + n + '</span></button>';
    });
    tabsEl.innerHTML = html;
    tabsEl.addEventListener('click', function (e) {
      var t = e.target.closest('.tab');
      if (!t) return;
      state.cat = t.dataset.cat;
      syncTabs();
      render();
    });
    syncTabs();
  }

  function syncTabs() {
    var tabs = tabsEl.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', tabs[i].dataset.cat === state.cat ? 'true' : 'false');
    }
  }

  function render() {
    var items = visible();

    countEl.textContent = state.q
      ? '找到 ' + items.length + ' 条结果' + (items.length ? '' : ' —— 换个关键词试试')
      : (state.cat === 'all' ? '全部 ' + items.length + ' 条提示词' : catName(state.cat) + ' · ' + items.length + ' 条');

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">' + icon('ghost', 34) +
        '<p>没有匹配的提示词。试试更短的关键词,或者点「全部」。</p></div>';
      return;
    }

    var html = '';
    items.forEach(function (p) {
      var id = PROMPTS.indexOf(p);
      var open = !!state.open[id];
      html +=
        '<article class="card' + (open ? ' open' : '') + '" data-id="' + id + '">' +
          '<button class="card-head" type="button" aria-expanded="' + open + '" aria-controls="panel-' + id + '">' +
            '<span class="num">' + String(id + 1).padStart(2, '0') + '</span>' +
            '<span class="head-main">' +
              '<h2>' + esc(p.title) + '</h2>' +
              '<p class="en">' + esc(p.en) + '</p>' +
              '<p class="desc">' + esc(p.desc) + '</p>' +
              '<span class="tags"><span class="tag">' + esc(catName(p.cat)) + '</span>' +
                p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
              '</span>' +
            '</span>' +
            '<span class="chev">' + icon('chev', 20) + '</span>' +
          '</button>' +
          '<div class="panel" id="panel-' + id + '">' +
            '<div class="code-wrap">' +
              '<div class="code-bar">' +
                '<span class="lbl"><span class="lbl-full">English System Prompt</span>' +
                '<span class="lbl-short">Prompt</span></span>' +
                '<button class="copy" type="button" data-copy="' + id + '">' +
                  icon('copy', 14) + '<em style="font-style:normal">复制提示词</em></button>' +
              '</div>' +
              '<pre>' + esc(p.prompt) + '</pre>' +
            '</div>' +
            (p.tip ? '<p class="hint"><b>用法:</b>' + esc(p.tip) + '</p>' : '') +
          '</div>' +
        '</article>';
    });
    listEl.innerHTML = html;
  }

  /* ---- 展开 / 收起 ---- */
  listEl.addEventListener('click', function (e) {
    var copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) { doCopy(copyBtn); return; }

    var head = e.target.closest('.card-head');
    if (!head) return;
    var card = head.closest('.card');
    var id = card.dataset.id;
    state.open[id] = !state.open[id];
    card.classList.toggle('open', state.open[id]);
    head.setAttribute('aria-expanded', String(!!state.open[id]));
  });

  /* ---- 一键复制(带 file:// 与微信内置浏览器降级方案) ---- */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }

  function doCopy(btn) {
    var p = PROMPTS[+btn.dataset.copy];
    copyText(p.prompt).then(function () {
      btn.classList.add('done');
      btn.innerHTML = icon('check', 14) + '<em style="font-style:normal">已复制</em>';
      toast('提示词已复制,直接粘进对话框即可');
      setTimeout(function () {
        btn.classList.remove('done');
        btn.innerHTML = icon('copy', 14) + '<em style="font-style:normal">复制提示词</em>';
      }, 1900);
    }).catch(function () {
      toast('这个浏览器不给复制权限,请长按选中文字复制', true);
    });
  }

  var toastTimer;
  function toast(msg, warn) {
    toastEl.innerHTML = (warn ? '' : '<i class="ok">' + icon('check', 15) + '</i>') + esc(msg);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  /* ---- 搜索 ---- */
  qEl.addEventListener('input', function () {
    state.q = qEl.value.trim();
    clearEl.classList.toggle('on', !!qEl.value);

  });
  clearEl.addEventListener('click', function () {
    qEl.value = ''; state.q = '';
    clearEl.classList.remove('on');
    render(); qEl.focus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
    if (e.key === 'Escape' && document.activeElement === qEl) { qEl.blur(); }
  });

  /* ---- 主题 ---- */
  var themeBtn = $('#theme');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);

  }
  var saved = 'dark';
  try { saved = localStorage.getItem('booklet-theme') || 'dark'; } catch (err) {}
  themeBtn.addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  /* ---- 吸顶时给工具栏加一条分割线 ---- */

  /* ---- 导出成一个完全自包含的离线 HTML ---- */
  $('#export').addEventListener('click', function () {
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-script').textContent;
    var close = '<' + '/script>';
    var doc =
      '<!doctype html>\n<html lang="zh-CN">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      '<title>' + esc(document.title) + '</title>\n' +
      '<meta name="theme-color" content="#0B0B0C">\n' +
      '</head>\n<body>\n<style id="app-style">' + css + '</style>\n' +
      SHELL + '\n<script id="app-script">' + js + close + '\n</body>\n</html>';

    var blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    // 文件名保持纯 ASCII:Chromium 会丢弃含中文的 download 属性,
    // 结果是一个没有扩展名的 "download" 文件,粉丝根本打不开。
    a.download = 'prompt-booklet-v1.0.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出:一个文件,断网也能打开');
  });

  /* ---- 初始化 ---- */
  $('#ico-search').innerHTML = icon('search', 17);
  $('#ico-dl').innerHTML = icon('down', 17);
